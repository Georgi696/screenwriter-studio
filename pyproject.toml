[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screenwriter-studio"
version = "0.1.0"
description = "An AI-assisted desk for short films: idea, screenplay, shot images, video clips."
readme = "README.md"
requires-python = ">=3.12"
# requirements.txt holds the exact versions the regression suite runs against.
dependencies = [
    "openai-agents>=0.3.3,<0.4",
    "openai>=1.109.1,<2",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1",
    "httpx>=0.28,<1",
    "pillow>=12.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
screenwriter-studio = "screenwriter_studio.cli:main"

[tool.setuptools.packages.find]
include = ["screenwriter_studio*"]

[tool.setuptools.package-data]
"screenwriter_studio.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = [".venv", ".venv-*"]

[tool.ruff.lint]
# Real defects only (syntax errors, undefined names, unused imports/variables); style is left alone.
select = ["E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["screenwriter_studio"]
